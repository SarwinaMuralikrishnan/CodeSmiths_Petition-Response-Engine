<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN Gov - Official Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #128807 100%);
            color: #333;
            margin: 0;
            padding: 0;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        header {
            background: linear-gradient(90deg, #FF9933, #FFCC99);
            color: #FFFFFF;
            padding: 30px;
            text-align: center;
            border-bottom: 5px solid #128807;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        #langToggle {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #128807;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: 0.3s;
            z-index: 1000;
        }

        #langToggle:hover {
            background: #0a5a04;
            transform: scale(1.05);
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            border: 3px solid #FF9933;
            backdrop-filter: blur(10px);
        }

        .admin-panel {
            background: #f0f4f8;
            padding: 25px;
            border-radius: 10px;
            margin-top: 25px;
            border-left: 5px solid #FF9933;
        }

        input,
        select,
        button.main-action {
            padding: 15px;
            margin-top: 10px;
            border: 2px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        button.main-action {
            background: linear-gradient(45deg, #128807, #0F6B3A);
            color: #FFFFFF;
            cursor: pointer;
            font-weight: 700;
            border: none;
            transition: transform 0.2s;
        }

        button.main-action:hover {
            transform: scale(1.02);
            background: #0F6B3A;
        }

        .status-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        .status-table th,
        .status-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        .status-table th {
            background-color: #128807;
            color: white;
        }

        .analytics {
            background: #fff3e0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #e65100;
        }
    </style>
</head>

<body>

    <header>
        <button id="langToggle" onclick="toggleLanguage()">தமிழ் / EN</button>
        <a href="/logout"
            style="position: absolute; top: 10px; right: 10px; background: #d9534f; color: white; padding: 5px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold;">🚪
            Logout</a>

        <h1 id="headerTitle">🏛️ TN Official Grievance Dashboard</h1>
        <p id="headerSub">Staff Access Only - Secure Status Management</p>
    </header>

    <div class="container">
        <div class="analytics">
            <h3 id="statsTitle">Live Portal Statistics 📊</h3>
            <p id="statsDisplay">Total: 0 | Resolved: 0 | Pending: 0</p>
        </div>

        <div id="adminPanel" class="admin-panel">
            <h3 id="controlTitle">Admin Controls (Staff Only) 🔑</h3>
            <label id="lblId">Enter Grievance ID to Update:</label>
            <input type="text" id="adminId" placeholder="e.g., TN-1234">

            <label id="lblStatus">Select New Status:</label>
            <select id="newStatus">
            </select>

            <button class="main-action" id="btnUpdate" onclick="updateStatus()">Update Petition Status ✅</button>
        </div>

        <div class="admin-panel" style="background: white; border-left-color: #128807;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="listTitle" style="margin: 0;">Incoming Petitions List</h3>
                <div>
                    <label id="lblFilter" style="font-weight: bold; margin-right: 10px;">Filter by Department:</label>
                    <select id="deptFilter" onchange="renderTable()"
                        style="padding: 8px; border-radius: 5px; width: auto; margin: 0;">
                        <option value="All">All Departments</option>
                        <option value="General">General</option>
                        <option value="Agriculture">Agriculture</option>
                        <option value="AnimalHusbandry">Animal Husbandry</option>
                        <option value="BackwardClassesWelfare">Backward Classes Welfare</option>
                        <option value="CommercialTaxes">Commercial Taxes</option>
                        <option value="Cooperation">Cooperation</option>
                        <option value="Education">Education</option>
                        <option value="Energy">Energy</option>
                        <option value="EnvironmentForests">Environment & Forests</option>
                        <option value="Finance">Finance</option>
                        <option value="FoodCivilSupplies">Food & Civil Supplies</option>
                        <option value="HealthFamilyWelfare">Health & Family Welfare</option>
                        <option value="HighwaysMinorPorts">Highways & Minor Ports</option>
                        <option value="HomeProhibitionExcise">Home, Prohibition & Excise</option>
                        <option value="HousingUrbanDevelopment">Housing & Urban Development</option>
                        <option value="Industries">Industries</option>
                        <option value="InformationTechnology">Information Technology</option>
                        <option value="LabourEmployment">Labour & Employment</option>
                        <option value="Law">Law</option>
                        <option value="MSME">MSME</option>
                        <option value="Public">Public</option>
                        <option value="PlanningDevelopment">Planning & Development</option>
                        <option value="PublicWorks">Public Works</option>
                        <option value="Revenue">Revenue</option>
                        <option value="RuralDevelopment">Rural Development</option>
                        <option value="SchoolEducation">School Education</option>
                        <option value="SocialWelfare">Social Welfare</option>
                        <option value="Tourism">Tourism</option>
                        <option value="Transport">Transport</option>
                        <option value="WaterResources">Water Resources</option>
                        <option value="YouthSports">Youth & Sports</option>
                        <option value="TamilDevelopment">Tamil Development</option>
                        <option value="ScienceTechnology">Science & Technology</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div style="overflow-x: auto;">
                <table class="status-table">
                    <thead>
                        <tr>
                            <th id="thId">ID</th>
                            <th id="thCitizen">Citizen</th>
                            <th id="thCategory">Category (AI)</th>
                            <th id="thPriority">Priority & Deadline</th>
                            <th id="thStatus">Current Status</th>
                        </tr>
                    </thead>
                    <tbody id="petitionTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let isTamil = false;
        let grievances = JSON.parse(localStorage.getItem('tn_db_final')) || [];

        const translations = {
            en: {
                headerTitle: "🏛️ TN Official Grievance Dashboard",
                headerSub: "Staff Access Only - Secure Status Management",
                statsTitle: "Live Portal Statistics 📊",
                controlTitle: "Admin Controls (Staff Only) 🔑",
                lblId: "Enter Grievance ID to Update:",
                lblStatus: "Select New Status:",
                btnUpdate: "Update Petition Status ✅",
                listTitle: "Incoming Petitions List",
                thId: "ID",
                thCitizen: "Citizen",
                thCategory: "Category (AI)",
                thPriority: "Priority & Deadline",
                thStatus: "Current Status",
                statusOptions: ["Under Review", "In Progress", "Resolved"],
                statsPrefix: "Total", statsResolved: "Resolved", statsPending: "Pending",
                btnLang: "தமிழ்",
                alertSuccess: "Updated successfully to",
                alertError: "ID not found.",
                lblFilter: "Filter by Department:",
                optAll: "All Departments"
            },
            ta: {
                headerTitle: "🏛️ தமிழ்நாடு அரசு அதிகாரப்பூர்வ மேலாண்மை",
                headerSub: "பணியாளர் அணுகல் மட்டும் - நிலை மேலாண்மை",
                statsTitle: "நேரடி புள்ளிவிவரங்கள் 📊",
                controlTitle: "நிர்வாகக் கட்டுப்பாடுகள் (அதிகாரிகள் மட்டும்) 🔑",
                lblId: "மனுவின் ஐடியை உள்ளிடவும்:",
                lblStatus: "புதிய நிலையைத் தேர்ந்தெடுக்கவும்:",
                btnUpdate: "மனுவின் நிலையை மாற்றவும் ✅",
                listTitle: "மனுக்களின் பட்டியல்",
                thId: "ஐடி (ID)",
                thCitizen: "பெயர்",
                thCategory: "வகை (AI)",
                thPriority: "முன்னுரிமை & கெடு",
                thStatus: "தற்போதைய நிலை",
                statusOptions: ["ஆய்வில் உள்ளது", "செயல்பாட்டில் உள்ளது", "தீர்க்கப்பட்டது"],
                statsPrefix: "மொத்தம்", statsResolved: "தீர்க்கப்பட்டவை", statsPending: "நிலுவையில் உள்ளவை",
                btnLang: "English",
                alertSuccess: "வெற்றிகரமாக மாற்றப்பட்டது",
                alertError: "ஐடி காணப்படவில்லை.",
                lblFilter: "துறை வாரியாக வடிகட்டவும்:",
                optAll: "அனைத்து துறைகளும்"
            }
        };

        function toggleLanguage() {
            isTamil = !isTamil;
            updateUI();
        }

        function updateUI() {
            const t = isTamil ? translations.ta : translations.en;

            document.getElementById('headerTitle').innerText = t.headerTitle;
            document.getElementById('headerSub').innerText = t.headerSub;
            document.getElementById('statsTitle').innerText = t.statsTitle;
            document.getElementById('controlTitle').innerText = t.controlTitle;
            document.getElementById('lblId').innerText = t.lblId;
            document.getElementById('lblStatus').innerText = t.lblStatus;
            document.getElementById('btnUpdate').innerText = t.btnUpdate;
            document.getElementById('listTitle').innerText = t.listTitle;
            document.getElementById('thId').innerText = t.thId;
            document.getElementById('thCitizen').innerText = t.thCitizen;
            document.getElementById('thCategory').innerText = t.thCategory;
            document.getElementById('thPriority').innerText = t.thPriority;
            document.getElementById('thStatus').innerText = t.thStatus;
            document.getElementById('langToggle').innerText = t.btnLang;
            document.getElementById('lblFilter').innerText = t.lblFilter;
            document.getElementById('deptFilter').options[0].innerText = t.optAll;

            const select = document.getElementById('newStatus');
            select.innerHTML = "";
            t.statusOptions.forEach((opt, index) => {
                const option = document.createElement('option');
                option.value = translations.en.statusOptions[index];
                option.innerText = opt;
                select.appendChild(option);
            });

            renderTable();
            updateStats();
        }

        function renderTable() {
            const t = isTamil ? translations.ta : translations.en;
            const body = document.getElementById('petitionTableBody');
            const filterVal = document.getElementById('deptFilter').value;

            let filteredGrievances = grievances;
            if (filterVal !== "All") {
                filteredGrievances = grievances.filter(g => (g.dept || 'General') === filterVal);
            }

            body.innerHTML = filteredGrievances.map(g => {
                const statusIdx = translations.en.statusOptions.indexOf(g.status);
                const displayStatus = statusIdx !== -1 ? t.statusOptions[statusIdx] : g.status;

                const isUrgent = g.isUrgent;
                const deadline = g.deadline ? g.deadline : "N/A";
                const priorityUrgentStr = isTamil ? "🚨 அவசரம்" : "🚨 Urgent";
                const priorityNormalStr = isTamil ? "சாதாரணம்" : "Normal";
                const dueStr = isTamil ? "கெடு" : "Due";

                let priorityHtml = isUrgent
                    ? `<span style="color: red; font-weight: bold;">${priorityUrgentStr}</span><br><small>${dueStr}: ${deadline}</small>`
                    : `<span style="color: grey;">${priorityNormalStr}</span><br><small>${dueStr}: ${deadline}</small>`;

                return `
                <tr>
                    <td><b>${g.id}</b></td>
                    <td>${g.name}</td>
                    <td>${g.dept || 'General'}</td>
                    <td>${priorityHtml}</td>
                    <td><span style="color: ${g.status === 'Resolved' ? 'green' : 'orange'}; font-weight: bold;">${displayStatus}</span></td>
                </tr>
            `;
            }).reverse().join('');
        }

        function updateStatus() {
            const id = document.getElementById('adminId').value.trim().toUpperCase();
            const status = document.getElementById('newStatus').value;
            const index = grievances.findIndex(g => g.id === id);
            const t = isTamil ? translations.ta : translations.en;

            if (index !== -1) {
                grievances[index].status = status;
                localStorage.setItem('tn_db_final', JSON.stringify(grievances));
                alert(`ID ${id} ${t.alertSuccess} ${status}!`);
                document.getElementById('adminId').value = "";
                renderTable();
                updateStats();
            } else {
                alert(t.alertError);
            }
        }

        function updateStats() {
            const t = isTamil ? translations.ta : translations.en;
            const total = grievances.length;
            const resolved = grievances.filter(g => g.status === "Resolved").length;
            const pending = total - resolved;
            document.getElementById('statsDisplay').innerText =
                `${t.statsPrefix}: ${total} | ${t.statsResolved}: ${resolved} | ${t.statsPending}: ${pending}`;
        }

        window.onload = updateUI;
    </script>

</body>

</html>
